<svg xmlns="http://www.w3.org/2000/svg" width="1457" height="1213" viewBox="0 0 1457 1213" fill="none"><defs><style>/* Miro-like hero pattern animation (trim + soft pulse) */
:root{
  --base:#404040;
  --ink:rgba(255,255,255,.42);
}
.line-base{
  stroke:var(--base);
  stroke-width:1;
  opacity:.28;
}
.line-anim{
  stroke:var(--ink);
  stroke-width:1.2;
  stroke-linecap:round;
  stroke-linejoin:round;

  stroke-dasharray:1;
  stroke-dashoffset:1;
  opacity:0;

  /* draw first, then pulse forever */
  animation:
    draw 1.9s cubic-bezier(.22,1,.36,1) forwards,
    pulse 6.5s ease-in-out infinite;
  animation-delay:
    calc(var(--i) * 70ms),
    calc(var(--i) * 70ms + 1200ms);
}
.drift{
  transform-box: fill-box;
  transform-origin: center;
  animation: drift 22s ease-in-out infinite alternate;
}
@keyframes draw{
  0%   { stroke-dashoffset:1; opacity:0; }
  18%  { opacity:.24; }
  100% { stroke-dashoffset:0; opacity:.18; }
}
@keyframes pulse{
  0%,100% { opacity:.14; }
  50%     { opacity:.26; }
}
@keyframes drift{
  from { transform: translate3d(0px,0px,0); }
  to   { transform: translate3d(18px,-12px,0); }
}
@media (prefers-reduced-motion: reduce){
  .line-anim{ animation:none; opacity:.18; stroke-dashoffset:0; }
  .drift{ animation:none; }
}</style><filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceGraphic" stdDeviation="1.1" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter><clipPath id="clip0_584_611">
<rect width="1457" height="1213" fill="white" />
</clipPath>
