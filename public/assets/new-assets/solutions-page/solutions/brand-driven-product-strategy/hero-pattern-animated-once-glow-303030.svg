<svg xmlns="http://www.w3.org/2000/svg" width="1457" height="1213" viewBox="0 0 1457 1213" fill="none">
<defs>
  <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="1.6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Background glow blur (Figma-like) -->
  <filter id="bgGlowBlur" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="160" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <radialGradient id="bgGlow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
    gradientTransform="translate(1277.5 402) rotate(0) scale(720 360)">
    <stop offset="0" stop-color="#0033FF" stop-opacity="0.28"/>
    <stop offset="0.55" stop-color="#A51FFF" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#A51FFF" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="bgGlow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
    gradientTransform="translate(-171.5 885) rotate(0) scale(720 360)">
    <stop offset="0" stop-color="#A51FFF" stop-opacity="0.22"/>
    <stop offset="0.55" stop-color="#0033FF" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#0033FF" stop-opacity="0"/>
  </radialGradient>
</defs>
<style><![CDATA[
svg{shape-rendering:geometricPrecision;}
.base path{stroke:#303030;stroke-opacity:0.85;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;}

/* no drift in "play once" mode */
.drift{transform-origin:center;transform-box:fill-box;animation:none;}

/* highlight: draw once + gentle opacity pulse, then stay */
.highlight path{
  stroke:rgba(255,255,255,0.24);
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:url(#softGlow);

  /* normalize for draw animation */
  stroke-dasharray:100;
  stroke-dashoffset:100;
  opacity:0;

  animation:
    draw 1.8s cubic-bezier(0.22,1,0.36,1) forwards,
    pulse 2.6s ease-in-out forwards;

  animation-delay:
    calc(var(--i) * 90ms),
    calc(var(--i) * 90ms);
}

@keyframes draw{
  to{stroke-dashoffset:0;}
}

@keyframes pulse{
  0%{opacity:0.06;}
  45%{opacity:0.42;}
  100%{opacity:0.20;}
}

/* Respect reduced motion */
@media (prefers-reduced-motion: reduce){
  .highlight path{
    animation:none !important;
    stroke-dashoffset:0;
    opacity:0.18;
  }
}
]]></style>
<g class="bg-glows" opacity="1">
  <g filter="url(#bgGlowBlur)">
    <ellipse cx="1277.5" cy="402" rx="552.5" ry="95" fill="url(#bgGlow1)"/>
  </g>
  <g filter="url(#bgGlowBlur)">
    <ellipse cx="-171.5" cy="885" rx="552.5" ry="95" fill="url(#bgGlow2)"/>
  </g>
</g>

