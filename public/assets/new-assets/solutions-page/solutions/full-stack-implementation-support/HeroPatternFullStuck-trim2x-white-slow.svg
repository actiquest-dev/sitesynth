<svg width="1457" height="941" viewBox="0 0 1457 941" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  .base-line{
    fill: none;
    stroke: #f3f3f3;
    stroke-width: 0.82;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.20;
    animation: baseBreathe 6.5s ease-in-out infinite;
  }

  @keyframes baseBreathe{
    0%   { opacity: 0.18; }
    50%  { opacity: 0.24; }
    100% { opacity: 0.18; }
  }

  .trim-line{
    fill: none;
    stroke: #ffffff;
    stroke-width: 1.05;
    stroke-linecap: round;
    stroke-linejoin: round;

    stroke-dasharray: 0 100;
    stroke-dashoffset: 100;
    opacity: 0;

    animation:
      trimLoop 5.8s cubic-bezier(0.22, 1, 0.36, 1) infinite,
      pulseLoop 5.8s ease-in-out infinite;
    animation-delay:
      calc(var(--i) * 110ms),
      calc(var(--i) * 110ms);
  }

  @keyframes trimLoop{
    0%   { stroke-dasharray: 0 100;  stroke-dashoffset: 100; }
    22%  { stroke-dasharray: 30 70; stroke-dashoffset: 74; }
    62%  { stroke-dasharray: 30 70; stroke-dashoffset: 22; }
    100% { stroke-dasharray: 0 100;  stroke-dashoffset: 0; }
  }

  @keyframes pulseLoop{
    0%   { opacity: 0.05; }
    42%  { opacity: 0.24; }
    100% { opacity: 0.05; }
  }

  @media (prefers-reduced-motion: reduce){
    .trim-line{
      animation: none !important;
      stroke-dashoffset: 0;
      opacity: 0.16;
    }
    .base-line{
      animation: none !important;
      opacity: 0.20;
    }
  }
</style>

