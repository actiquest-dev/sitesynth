<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: Inter, Arial, sans-serif;
        margin: 16px;
        color: #111;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
      }
      textarea {
        width: 100%;
        height: 260px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 11px;
        padding: 10px;
        border: 1px solid #ddd;
      }
      button {
        margin-top: 12px;
        padding: 8px 12px;
        background: #6d28d9;
        color: #fff;
        border: none;
        cursor: pointer;
      }
      .hint {
        margin-top: 10px;
        font-size: 11px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>SiteSynth Build Plan</h1>
    <textarea id="status" readonly placeholder="Waiting for SiteSynth jobs..."></textarea>
    <div class="hint">Keep this plugin open. It auto-polls SiteSynth for new build jobs.</div>

    <script>
      const statusEl = document.getElementById('status')

      // UI is passive: it only renders status messages from the plugin.

      window.onmessage = (event) => {
        const msg = event.data.pluginMessage
        if (!msg) return
        if (msg.type === 'status') {
          statusEl.value = msg.text
        }
        if (msg.type === 'ready') {
          statusEl.value = 'Build plan received. Starting build...'
        }
      }
    </script>
  </body>
</html>
